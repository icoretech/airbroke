name: Build and publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published stable release tag to qualify
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: stable-image-publisher
  queue: max
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
  IMAGE: ghcr.io/icoretech/airbroke

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      minor: ${{ steps.release.outputs.minor }}
      candidate: ${{ steps.release.outputs.candidate }}

    steps:
      - name: Check out publisher tooling
        uses: actions/checkout@v7
        with:
          ref: main
          path: tooling
          persist-credentials: false

      - name: Resolve current stable release
        id: release
        run: |
          [[ "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" > "$RUNNER_TEMP/commit.json"
          node tooling/bin/validate-image-release.mjs "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/commit.json"
          echo "candidate=candidate-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Validate release source
        run: node tooling/bin/validate-image-release.mjs "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/commit.json" source

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/icoretech/airbroke
          flavor: latest=false
          labels: |
            io.artifacthub.package.category=monitoring-logging
            io.artifacthub.package.keywords=error,catcher,react,web,app,open,source,modern
            io.artifacthub.package.license=MIT
            io.artifacthub.package.logo-url=https://icoretech.github.io/helm/charts/airbroke/logo.png
            io.artifacthub.package.maintainers=[{"name":"Claudio Poli","email":"claudio@icorete.ch"}]
            io.artifacthub.package.readme-url=https://github.com/icoretech/airbroke/blob/main/README.md
            org.opencontainers.image.description=Airbroke is a a modern, React-based open source error catcher web application
            org.opencontainers.image.source=https://github.com/icoretech/airbroke
            org.opencontainers.image.title=Airbroke
            org.opencontainers.image.vendor=iCoreTech, Inc.
            org.opencontainers.image.documentation=https://github.com/icoretech/airbroke/blob/main/README.md
            org.opencontainers.image.url=https://airbroke.icorete.ch
            org.opencontainers.image.authors=Claudio Poli <claudio@icorete.ch>
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ needs.prepare.outputs.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.candidate }}-${{ matrix.arch }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./source
          platforms: linux/${{ matrix.arch }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          provenance: false

  promote:
    needs: [prepare, build]
    runs-on: ubuntu-26.04
    env:
      EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
      VERSION: ${{ needs.prepare.outputs.version }}
      MINOR: ${{ needs.prepare.outputs.minor }}
      CANDIDATE: ${{ needs.prepare.outputs.candidate }}
    steps:
      - name: Check out publisher tooling
        uses: actions/checkout@v7
        with:
          ref: main
          path: tooling
          persist-credentials: false

      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble validated platform candidates
        id: candidate
        run: |
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "$IMAGE:$CANDIDATE-$arch" --format '{"manifest": {{json .Manifest}}, "image": {{json .Image}}}' > "$RUNNER_TEMP/$arch.json"
          done
          node tooling/bin/validate-image-platforms.mjs "$RUNNER_TEMP/amd64.json" "$RUNNER_TEMP/arm64.json" > "$RUNNER_TEMP/digests.txt"
          mapfile -t digests < "$RUNNER_TEMP/digests.txt"
          docker buildx imagetools create --tag "$IMAGE:$CANDIDATE" "$IMAGE@${digests[0]}" "$IMAGE@${digests[1]}"
          docker buildx imagetools inspect "$IMAGE:$CANDIDATE" --raw > "$RUNNER_TEMP/index.json"
          jq -e --arg amd64 "${digests[0]}" --arg arm64 "${digests[1]}" '
            (.manifests | length) == 2 and
            ([.manifests[] | {digest, platform}] | sort_by(.platform.architecture)) ==
            [{digest: $amd64, platform: {architecture: "amd64", os: "linux"}}, {digest: $arm64, platform: {architecture: "arm64", os: "linux"}}]
          ' "$RUNNER_TEMP/index.json"
          digest=$(docker buildx imagetools inspect "$IMAGE:$CANDIDATE" --format '{{.Manifest.Digest}}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Promote the still-current stable release
        env:
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          # Requalification may repair metadata, but must never change a version's source commit.
          if docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Image}}' > "$RUNNER_TEMP/existing-image.json" 2> "$RUNNER_TEMP/inspect-error.txt"; then
            jq -e --arg sha "$EXPECTED_SHA" '
              [.. | objects | select(has("config")) | .config.Labels["org.opencontainers.image.revision"]] |
              length > 0 and all(. == $sha)
            ' "$RUNNER_TEMP/existing-image.json"
          else
            cat "$RUNNER_TEMP/inspect-error.txt" >&2
            grep -Fxq "ERROR: $IMAGE:$VERSION: not found" "$RUNNER_TEMP/inspect-error.txt" || grep -q 'manifest unknown' "$RUNNER_TEMP/inspect-error.txt"
          fi
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" > "$RUNNER_TEMP/commit.json"
          node tooling/bin/validate-image-release.mjs "$RUNNER_TEMP/releases.json" "$RUNNER_TEMP/commit.json" source
          docker buildx imagetools create --tag "$IMAGE:$VERSION" --tag "$IMAGE:$MINOR" --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
