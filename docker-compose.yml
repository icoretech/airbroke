name: airbroke

x-healthcheck-postgres: &postgres_healthcheck
  test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
  start_period: 1m
  interval: 10s
  timeout: 5s
  retries: 5

services:
  db:
    image: postgres:19
    # command: postgres -c 'shared_buffers=128MB'
    environment:
      POSTGRES_PASSWORD: airbroke
      POSTGRES_DB: airbroke_development
    volumes:
      # Keep the historical volume visible so PostgreSQL detects an existing 18 cluster.
      - db_data_pg18:/var/lib/postgresql
      # - ./prisma/pg-init-scripts:/docker-entrypoint-initdb.d
    ports:
      - 5460:5432
    networks:
      - airbroke
    healthcheck: *postgres_healthcheck

  testdb:
    image: postgres:19
    profiles:
      - test
    # command: postgres -c 'shared_buffers=128MB'
    environment:
      POSTGRES_PASSWORD: airbroke
      POSTGRES_DB: airbroke_test
    networks:
      - airbroke
    healthcheck: *postgres_healthcheck

  webbase:
    build:
      context: "."
      dockerfile: Dockerfile.dev
    image: icoretech/airbroke:develop
    entrypoint: /bin/sh -lc
    command: yarn install
    volumes:
      - .:/app
    networks:
      - airbroke

  web:
    build:
      context: "."
      dockerfile: Dockerfile.dev
    image: icoretech/airbroke:develop
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:airbroke@db/airbroke_development?connection_limit=8&connection_timeout=5"
      DIRECT_URL: "postgresql://postgres:airbroke@db/airbroke_development"
      SKIP_YARN_INSTALL: "1"
    ports:
      - 3000:3000
      - 9229:9229
    networks:
      - airbroke
    depends_on:
      db:
        condition: service_healthy
      webbase:
        condition: service_completed_successfully
    volumes:
      - .:/app

  test:
    image: icoretech/airbroke:develop
    profiles:
      - test
    command: yarn test --run
    environment:
      DATABASE_URL: "postgresql://postgres:airbroke@testdb/airbroke_test?connection_limit=15"
      DIRECT_URL: "postgresql://postgres:airbroke@testdb/airbroke_test"
      TESTING: "true"
      SKIP_YARN_INSTALL: "1"
    volumes:
      - .:/app
    networks:
      - airbroke
    depends_on:
      testdb:
        condition: service_healthy
      webbase:
        condition: service_completed_successfully

volumes:
  db_data_pg18:
    name: ${AIRBROKE_DB_VOLUME:-${COMPOSE_PROJECT_NAME}_db_data_pg18}
  npm_cache:
  yarn_cache:

networks:
  airbroke:
    name: airbroke
